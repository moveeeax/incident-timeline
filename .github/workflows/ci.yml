name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o incident-timeline .

      - name: Smoke test the CLI
        run: |
          ./incident-timeline --slack examples/slack-export.json --pd examples/pagerduty-log.json | tee /tmp/out.md
          grep -q "Time to resolve (MTTR)" /tmp/out.md
