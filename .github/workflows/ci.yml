name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: incident-timeline
    steps:
      - uses: actions/checkout@v4

      # The self-hosted ARC runner is minimal; install the Go toolchain via apt
      # rather than a download-based action (no xz available for .tar.xz).
      - name: Install Go
        run: |
          sudo apt-get update
          sudo apt-get install -y golang-go
          go version

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o incident-timeline .

      - name: Smoke test the CLI
        run: |
          ./incident-timeline --slack examples/slack-export.json --pd examples/pagerduty-log.json | tee /tmp/out.md
          grep -q "Time to resolve (MTTR)" /tmp/out.md
